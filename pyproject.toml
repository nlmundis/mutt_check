[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mutt_check"
dynamic = ["version"]
description = "Prove a test suite catches the defects it claims to pin: curated mutants, a mandatory control run, and a STALE verdict."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Mundis" }]
keywords = ["testing", "mutation-testing", "unittest", "test-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
# tomllib arrived in 3.11; tomli is the same parser for the versions below it.
dependencies = ['tomli>=1.1.0; python_version < "3.11"']

[project.scripts]
mutt_check = "mutt_check:main"

[tool.setuptools]
py-modules = ["mutt_check"]

# One version, in mutt_check.__version__.
[tool.setuptools.dynamic]
version = { attr = "mutt_check.__version__" }
