[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mutt_check"
dynamic = ["version"]
description = "Prove a test suite catches the defects it claims to pin: curated mutants, a mandatory control run, and a STALE verdict."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Mundis" }]
keywords = ["testing", "mutation-testing", "unittest", "test-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
# tomllib arrived in 3.11; tomli is the same parser for the versions below it.
dependencies = ['tomli>=1.1.0; python_version < "3.11"']

[project.scripts]
mutt_check = "mutt_check:main"

[tool.setuptools]
py-modules = ["mutt_check"]

# One version, in mutt_check.__version__.
[tool.setuptools.dynamic]
version = { attr = "mutt_check.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test classes and methods are named as sentences stating what they pin; a
# docstring would restate the name. Every other docstring rule still applies.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"examples/*/tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.mypy]
python_version = "3.9"
strict = true
# The worked example is left out: its suite is deliberately weak, and its
# `tests` package would collide with this repository's own.
files = ["mutt_check.py", "tests"]

[[tool.mypy.overrides]]
# Tests are type-checked, but test methods need not be annotated.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
